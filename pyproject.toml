[project]
name = "defect-report-automation"
version = "0.1.0"
description = "Turns unstructured switchgear quality reports into validated quality tickets."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
